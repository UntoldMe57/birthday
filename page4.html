        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            overflow-y: auto;
            scrollbar-width: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            width: 100%;
            background: url("stage.JPG") center center / cover no-repeat fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cormorant Garamond', serif;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 35px 15px;
        }

        /* Background overlay */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(120, 0, 0, 0.35);
            backdrop-filter: blur(2px);
            z-index: 0;
            pointer-events: none;
        }

        /* Main content */

        .center {
            position: relative;
            width: 100%;
            max-width: 900px;
            text-align: center;
            color: #ffd6d6;
            z-index: 2;
            padding: 20px 10px;
        }

        /* Heading */

        h2 {
            font-size: clamp(28px, 4vw, 48px);
            margin-bottom: 25px;
            text-shadow: 2px 2px 15px rgba(255, 0, 0, 0.6);
        }

        /* Image */

        .center img {
            width: 320px;
            max-width: 90%;
            height: auto;
            max-height: 55vh;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            margin-bottom: 25px;
        }

        /* Buttons */

        button {
            padding: 14px 35px;
            margin: 10px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Cormorant Garamond', serif;
            transition: 0.3s;
        }

        .yes-btn {
            background: #ff4d6d;
            color: white;
        }

        .yes-btn:hover {
            background: #ff1e4d;
            transform: scale(1.08);
        }

        .no-btn {
            background: white;
            color: #c4002f;
        }

        .no-btn:hover {
            background: #ffe6e6;
            transform: scale(1.08);
        }

        /* Entry animation */

        .center>* {
            opacity: 0;
            transform: translateY(60px);
            animation: riseUp 1s ease forwards;
        }

        .center h2 {
            animation-delay: 0.2s;
        }

        .center img {
            animation-delay: 0.5s;
        }

        .center .yes-btn {
            animation-delay: 0.8s;
        }

        .center .no-btn {
            animation-delay: 1s;
        }

        @keyframes riseUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Left popup */

        .popup-left {
            position: fixed;
            top: 50%;
            left: -500px;
            transform: translateY(-50%);
            background: #7a0019;
            color: white;
            padding: 30px 50px;
            border-radius: 20px;
            font-size: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            transition: 0.8s ease;
            z-index: 9999;
            max-width: 85%;
        }

        .popup-left.show {
            left: 30px;
        }

        /* Right popup */

        .popup-right {
            position: fixed;
            top: 50%;
            right: -600px;
            transform: translateY(-50%);
            background: #99002a;
            color: white;
            padding: 30px 50px;
            border-radius: 20px;
            font-size: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            transition: 0.8s ease;
            z-index: 9999;
            max-width: 85%;
        }

        .popup-right.show {
            right: 30px;
        }

        /* Tablet */

        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }

            .center img {
                width: 300px;
            }

            .popup-left,
            .popup-right {
                font-size: 20px;
                padding: 20px 25px;
            }
        }

        /* Mobile */

        @media (max-width: 480px) {
            body {
                padding: 25px 12px;
                background-attachment: scroll;
            }

            .center {
                padding: 20px 5px;
            }

            h2 {
                font-size: 30px;
                line-height: 1.3;
                margin-bottom: 20px;
            }

            .center img {
                width: 280px;
                max-width: 90%;
                max-height: 50vh;
                margin-bottom: 20px;
            }

            button {
                display: block;
                width: min(260px, 90%);
                margin: 14px auto;
                padding: 13px 15px;
                font-size: 18px;
            }

            .popup-left,
            .popup-right {
                width: calc(100% - 40px);
                max-width: 350px;
                left: auto;
                right: auto;
                padding: 20px;
                font-size: 19px;
                text-align: center;
            }

            .popup-left {
                top: 35%;
                transform: translateY(-50%) translateX(-150%);
            }

            .popup-left.show {
                left: 50%;
                transform: translate(-50%, -50%);
            }

            .popup-right {
                top: 65%;
                transform: translateY(-50%) translateX(150%);
            }

            .popup-right.show {
                right: auto;
                left: 50%;
                transform: translate(-50%, -50%);
            }
        }

        /* Short-height screens */

        @media (max-height: 600px) {
            body {
                align-items: flex-start;
            }

            .center {
                padding-top: 15px;
                padding-bottom: 25px;
            }

            .center img {
                max-height: 40vh;
            }

            h2 {
                margin-top: 10px;
            }
        }
    </style>

<body>

    <div class="center">
        <h2>Do you remember this day? 💖</h2>
        <img src="sel.jpg">

        <br>

        <button class="yes-btn" onclick="nextPage()">Yes I Do ❤️</button>
        <button class="no-btn" onclick="showPopups()">No I'm Not Remembered 💔</button>
    </div>

    <!-- POPUPS -->
    <div id="popup1" class="popup-left">
        Think... Think about it 💭
    </div>

    <div id="popup2" class="popup-right">
        Remember babie... you know that day ❤️
    </div>

    <script>
        function nextPage() {
            window.location.href = "page5.html";
        }

        function showPopups() {

            let p1 = document.getElementById("popup1");
            let p2 = document.getElementById("popup2");

            p1.classList.add("show");

            setTimeout(() => {
                p2.classList.add("show");
            }, 600);

            // Hide both after few seconds
            setTimeout(() => {
                p1.classList.remove("show");
                p2.classList.remove("show");
            }, 4000);
        }
    </script>

</body>
